
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">
<title>SS Auto Inspector</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#eee;font-family:Tahoma,Arial,sans-serif}
header{padding:25px 18px;background:#080808;border-bottom:1px solid #b99a50}
.logo{font-size:27px;font-weight:bold;color:#d6b765;letter-spacing:1px}
.sub{color:#999;font-size:12px;margin-top:8px}
main{padding:16px;max-width:700px;margin:auto}
h2{color:#d6b765;font-size:17px;margin:25px 0 14px}
.card{background:#1b1b1b;border:1px solid #333;border-radius:12px;padding:15px;margin-bottom:14px}
label{display:block;color:#bbb;font-size:12px;margin:12px 0 7px}
input,select,textarea{width:100%;padding:12px;background:#101010;border:1px solid #444;border-radius:8px;color:white;font-size:14px}
button{border:0;border-radius:9px;padding:13px;font-size:14px;font-weight:bold;cursor:pointer}
.gold{background:#c5a354;color:#111;width:100%;margin-top:12px}
.secondary{background:#333;color:#eee}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:center;border-bottom:1px solid #333;padding:12px 0}
.panel strong{font-size:13px}
.panel input{grid-column:1/-1}
small{color:#aaa}
#report{white-space:pre-wrap;line-height:2;font-size:13px}
footer{text-align:center;color:#777;font-size:11px;padding:25px}
</style>
</head>
<body>
<header>
<div class="logo">SS AUTO INSPECTOR</div>
<div class="sub">PROFESSIONAL VEHICLE INSPECTION SYSTEM</div>
</header>
<main>
<div class="card">
<h2>مشخصات خودرو</h2>
<div class="grid">
<div><label>نام مالک</label><input id="owner" placeholder="نام و نام خانوادگی"></div>
<div><label>شماره تماس</label><input id="phone" placeholder="شماره تماس"></div>
<div><label>برند خودرو</label><input id="brand" placeholder="مثلاً ایران خودرو"></div>
<div><label>مدل خودرو</label><input id="model" placeholder="مدل و تیپ"></div>
<div><label>سال ساخت</label><input id="year" placeholder="سال"></div>
<div><label>رنگ خودرو</label><input id="color" placeholder="رنگ"></div>
</div>
<label>شماره پلاک</label><input id="plate" placeholder="شماره پلاک">
<label>شماره VIN</label><input id="vin" placeholder="شماره ۱۷ رقمی VIN">
<label>شماره شاسی</label><input id="chassis" placeholder="شماره شاسی">
<label>شماره سریال</label><input id="serial" placeholder="شماره سریال">
</div>

<div class="card">
<h2>کارشناسی وضعیت بدنه</h2>
<small>برای هر قطعه وضعیت را انتخاب و در صورت نیاز ضخامت را ثبت کنید.</small>
<div id="panels"></div>
</div>

<div class="card">
<h2>اصالت و مشخصات فنی</h2>
<label>وضعیت شماره شاسی</label>
<select id="chassisStatus">
<option>فابریک</option><option>مخدوش</option><option>دستکاری شده</option><option>نیازمند بررسی</option>
</select>
<label>وضعیت شماره موتور</label>
<select id="engineStatus">
<option>فابریک</option><option>مغایرت دارد</option><option>دستکاری شده</option><option>نیازمند بررسی</option>
</select>
<label>توضیحات اصالت خودرو</label>
<textarea id="authNotes" rows="3"></textarea>
</div>

<div class="card">
<h2>خدمات و بررسی‌های تکمیلی</h2>
<div id="services"></div>
<label>توضیحات نهایی کارشناس</label>
<textarea id="notes" rows="4" placeholder="شرح ایرادات و توضیحات..."></textarea>
</div>

<button class="gold" onclick="saveReport()">ذخیره کارشناسی</button>
<button class="secondary" style="width:100%;margin-top:10px" onclick="showReport()">مشاهده گزارش</button>
<button class="secondary" style="width:100%;margin-top:10px" onclick="window.print()">چاپ / ذخیره PDF</button>
<div class="card" id="reportBox" style="display:none;margin-top:15px">
<h2>گزارش کارشناسی</h2>
<div id="report"></div>
<button class="gold" onclick="copyReport()">کپی گزارش</button>
</div>
</main>
<footer>SS AUTO INSPECTOR · SAMAN SAFARI</footer>

<script>
const parts=[
"کاپوت","سقف","صندوق عقب","گلگیر جلو راست","گلگیر جلو چپ",
"درب جلو راست","درب جلو چپ","درب عقب راست","درب عقب چپ",
"گلگیر عقب راست","گلگیر عقب چپ","ستون A راست","ستون A چپ",
"ستون B راست","ستون B چپ","ستون C راست","ستون C چپ",
"سینی جلو","سینی عقب","شاسی جلو راست","شاسی جلو چپ",
"شاسی عقب راست","شاسی عقب چپ"
];
const statuses=["فابریک","رنگ‌شده","بتونه","تعویضی","آسیب‌دیده","بررسی نشده"];
const panels=document.getElementById("panels");
parts.forEach((p,i)=>{
let d=document.createElement("div");
d.className="panel";
d.innerHTML=`<strong>${p}</strong>
<select id="p${i}">${statuses.map(s=>`<option>${s}</option>`).join("")}</select>
<input id="m${i}" type="number" placeholder="ضخامت رنگ (میکرون) - اختیاری">`;
panels.appendChild(d);
});
const serviceList=["دیاگ و بررسی خطاها","کارشناسی فنی","بررسی موتور و گیربکس","پولیش","سرامیک بدنه","شیشه دودی","شیشه شفاف","شفاف‌سازی چراغ"];
const services=document.getElementById("services");
serviceList.forEach((s,i)=>{
services.innerHTML+=`<label><input type="checkbox" id="s${i}" style="width:auto;margin-left:8px">${s}</label>`;
});
function makeReport(){
let r="SS AUTO INSPECTOR\nگزارش کارشناسی خودرو\n";
r+="تاریخ: "+new Date().toLocaleDateString("fa-IR")+"\n\n";
["owner","phone","brand","model","year","color","plate","vin","chassis","serial"].forEach(id=>{
let names={owner:"مالک",phone:"تماس",brand:"برند",model:"مدل",year:"سال ساخت",color:"رنگ",plate:"پلاک",vin:"VIN",chassis:"شماره شاسی",serial:"شماره سریال"};
r+=names[id]+": "+document.getElementById(id).value+"\n";
});
r+="\nوضعیت قطعات بدنه:\n";
parts.forEach((p,i)=>{
let v=document.getElementById("p"+i).value;
let m=document.getElementById("m"+i).value;
r+=p+": "+v+(m?" | ضخامت: "+m+" میکرون":"")+"\n";
});
r+="\nاصالت خودرو:\nشماره شاسی: "+chassisStatus.value+"\nشماره موتور: "+engineStatus.value+"\n"+authNotes.value;
r+="\n\nخدمات انجام‌شده:\n";
serviceList.forEach((s,i)=>{if(document.getElementById("s"+i).checked)r+="- "+s+"\n"});
r+="\nتوضیحات کارشناس:\n"+notes.value;
return r;
}
function saveReport(){
let data={report:makeReport(),date:new Date().toISOString()};
let saved=JSON.parse(localStorage.getItem("ss_reports")||"[]");
saved.push(data);
localStorage.setItem("ss_reports",JSON.stringify(saved));
alert("گزارش با موفقیت روی این دستگاه ذخیره شد.");
}
function showReport(){
document.getElementById("report").textContent=makeReport();
document.getElementById("reportBox").style.display="block";
}
function copyReport(){
let t=document.getElementById("report").textContent;
if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert("گزارش کپی شد."));
else alert("امکان کپی در این مرورگر فعال نیست.");
}
</script>
</body>
</html>
